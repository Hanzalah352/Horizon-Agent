#main.blank{justify-content:center}#main.blank #msgs{flex:0 0 auto;overflow:visible}#main.blank header{position:absolute;top:0;left:0;right:0}#main.blank .hero{height:auto;padding-bottom:22px}#chips{margin:14px auto 0;max-width:680px;padding:0 16px}#chips:empty{display:none}#send{box-shadow:0 1px 2px #0003}#send:disabled{opacity:.45}

<aside id="side">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.356-8-5.096 0-5.096 8 0 8 5.223 0 7.26-8 12.356-8z"/></svg>Horizon</div>
  <button class="btn" id="new" data-ic="plus">New chat</button>

<script>
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){
  const parts=t.split(/```/);
  return parts.map((p,i)=>{
    if(i%2){p=p.replace(/^[^\n]*\n/,'');return '<pre><code>'+esc(p)+'</code></pre>'}
    return esc(p).split(/\n{2,}/).filter(x=>x.trim()).map(x=>'<p>'+x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>').join('');
  }).join('');
}
const IN_CLAUDE=!!(window.claude&&window.claude.use);
var claude=window.claude||{use:async n=>n==='downloads'?{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;a.click()}}:null};
const getK=n=>{try{return localStorage.getItem(n)||''}catch(e){return window['_'+n]||''}};
const setK=(n,v)=>{window['_'+n]=v;try{localStorage.setItem(n,v)}catch(e){}};
let _s=null;
async function sample(input,opts){
  opts=opts||{};
  if(IN_CLAUDE){if(!_s)_s=await claude.use('sample');if(!_s)throw new Error('The AI connection is not available.');return _s(input,opts)}
  const key=getK('gk');if(!key)throw new Error('Add your Groq API key first: Customize, then API keys.');
  const msgs=typeof input==='string'?[{role:'user',content:input}]:input.slice();
  const tools=opts.tools||[];
  const schemas=tools.map(t=>({type:'function',function:{name:t.name,description:t.description,parameters:t.inputSchema||{type:'object',properties:{}}}}));
  let full='';
  for(let round=0;round<6;round++){
    const body={model:'openai/gpt-oss-120b',messages:msgs,temperature:1,max_completion_tokens:2048,top_p:1,reasoning_effort:'medium',stream:true};
    if(schemas.length){body.tools=schemas;body.tool_choice='auto'}
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('Groq '+r.status+': '+(await r.text()).slice(0,200));
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='';const calls={};
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:')||line.includes('[DONE]'))continue;
        const d=(JSON.parse(line.slice(5)).choices||[{}])[0].delta||{};
        if(d.content){text+=d.content;full+=d.content;if(opts.onText)opts.onText({text:full})}
        (d.tool_calls||[]).forEach(tc=>{const c=calls[tc.index]=calls[tc.index]||{id:'',name:'',args:''};if(tc.id)c.id=tc.id;if(tc.function&&tc.function.name)c.name+=tc.function.name;if(tc.function&&tc.function.arguments)c.args+=tc.function.arguments})}}
    const list=Object.values(calls);if(!list.length)return {text:full};
    msgs.push({role:'assistant',content:text||'',tool_calls:list.map(c=>({id:c.id,type:'function',function:{name:c.name,arguments:c.args||'{}'}}))});
    for(const c of list){const t=tools.find(x=>x.name===c.name);let out;try{out=await t.execute(JSON.parse(c.args||'{}'))}catch(e){out='Tool error: '+e.message}msgs.push({role:'tool',tool_call_id:c.id,content:String(out)})}
  }
  return {text:full};
}
const browseTool=onTool=>({name:'browse_web',description:'Hand a task to the Browser Use cloud browser agent, which browses the real web (search, open pages, click, extract data) and returns the result.',inputSchema:{type:'object',properties:{task:{type:'string',description:'What the browser agent should do'}},required:['task']},
  execute:async({task})=>{
    onTool('browse_web('+task+')');
    const k=getK('bk');if(!k)throw new Error('No Browser Use key. Add it in Customize, then API keys.');
    const H={'X-Browser-Use-API-Key':k,'Content-Type':'application/json'},B='https://api.browser-use.com/api/v4';
    const r=await fetch(B+'/runs',{method:'POST',headers:H,body:JSON.stringify({task:task})});
    if(!r.ok)throw new Error('Browser Use '+r.status+': '+(await r.text()).slice(0,200));
    const run=await r.json();const id=run.id||run.runId||(run.run&&run.run.id);
    if(!id)return JSON.stringify(run).slice(0,3000);
    for(let i=0;i<60;i++){
      await new Promise(y=>setTimeout(y,3000));
      const st=await (await fetch(B+'/runs/'+id+'/status',{headers:H})).json();
      const v=String(typeof st==='string'?st:(st.status||st.state||'')).toLowerCase();
      if(v==='completed'||v==='failed'||v==='cancelled')break;
    }
    const f=await (await fetch(B+'/runs/'+id,{headers:H})).json();
    return String(f.output||f.result||f.answer||JSON.stringify(f)).slice(0,6000);
  }});

const SYSTEM='You are Horizon Agent, a capable assistant. Use your tools when they help (current time, math). Think step by step, then answer clearly. Use markdown code fences for code.';
async function agent(history,onText,onTool){
  const last=history[history.length-1].content;
  const prev=history.slice(0,-1).map(x=>x.role+': '+x.content).join('\n');
  const pj=projects.find(p=>cur&&p.id===cur.pid);const bt=bots.find(b=>cur&&b.id===cur.bot);const sk=SKILLS.filter(x=>skillsOn.includes(x.id));const input=SYSTEM+(sk.length?'\n\nEnabled skills:\n'+sk.map(x=>'- '+x.n+': '+x.i).join('\n'):'')+(bt?'\n\nYou are the bot "'+bt.name+'" ('+bt.kind+' agent). Personality and role: '+bt.persona:'')+(pj&&pj.ins?'\n\nProject "'+pj.name+'" instructions: '+pj.ins:'')+(prev?'\n\nConversation so far:\n'+prev:'')+'\n\nLatest user message: '+last;
  const tools=[
    {name:'calculate',description:'Evaluate a math expression, e.g. 12*(3+4)^2.',inputSchema:{type:'object',properties:{expression:{type:'string'}},required:['expression']},

async function snap(doc,W,H,ctx,w,h){

  const xml=new XMLSerializer().serializeToString(clone);

async function renderMP4(doc,W,H,w,h,secs,fps,prog){

    await snap(doc,W,H,ctx,w,h);
